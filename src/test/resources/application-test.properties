# =============================================================
# Test configuration — uses H2 in-memory database.
# Activates via @ActiveProfiles("test") or spring.profiles.active=test.
# =============================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable multipart for unit tests (mocked via MockMvc / MockMultipartFile)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Disable security auto-config noise in test output
logging.level.org.springframework.security=WARN
logging.level.com.dsgp=WARN

# Disable DevTools in test
spring.devtools.restart.enabled=false

# JWT placeholder (required to satisfy @Value injection)
app.jwt.secret=TEST_SECRET_NOT_USED_IN_TESTS
app.jwt.expiration-ms=86400000

# Upload dir for tests (temp directory)
app.storage.upload-dir=./target/test-uploads
