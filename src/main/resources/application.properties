# =============================================================
# Digital Subsidy and Grant Administration Platform
# Application Configuration
# =============================================================
# Phase: Architecture & Project Structure Setup
# Business module configuration will be added in subsequent phases.
# =============================================================

# ── Application ──────────────────────────────────────────────
spring.application.name=digital-subsidy-grant-platform

# ── DataSource (MySQL) ────────────────────────────────────────
# Use environment variables or a local override file for credentials.
# DO NOT hard-code credentials here.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:digital_subsidy_grant}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:dsgp_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Development mode: auto-update schema from entity definitions.
# Change to 'validate' or 'none' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ── Connection Pool (HikariCP defaults) ──────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ── Web / Server ──────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api/v1

# ── Logging ───────────────────────────────────────────────────
logging.level.com.dsgp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ── DevTools ─────────────────────────────────────────────────
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ── JWT Foundation ────────────────────────────────────────────
# Placeholder values — replace with secure secrets before deployment.
# JWT secret must be a Base64-encoded key of at least 256 bits.
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_SECURE_BASE64_SECRET_IN_ENV}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── File Storage ──────────────────────────────────────────────
# Document upload location — used by BeneficiaryServiceImpl for local filesystem storage.
app.storage.upload-dir=${UPLOAD_DIR:./uploads}

# ── Multipart File Upload (Module 1 — Document Upload) ────────
# Maximum size per file uploaded (Aadhaar, PAN, land records, etc.)
spring.servlet.multipart.max-file-size=5MB
# Maximum total multipart request size (file + metadata)
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ── Actuator (management endpoints — disabled by default) ─────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
